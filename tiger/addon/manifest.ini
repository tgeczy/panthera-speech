name = tigerspeech
summary = "Tiger-speech (MacinTalk 3.3)"
description = """Speak with the voices Apple shipped in Mac OS X 10.4 Tiger, including Fred as he sounded in 2005, which is not the Fred any current system will give you.

Apple's engine runs as native code on your own machine. There is no virtual machine and no emulator: a small host process maps Tiger's Intel MacinTalk into memory and calls it directly. An utterance takes about twelve milliseconds.

Tiger's MacinTalk is three engines in one bundle, and the voices divide between them. MacinTalk 3 drives Fred, Kathy, Princess, Junior, Ralph and the novelty voices. MacinTalk Pro drives Bruce, Victoria and Agnes. A third engine exists to drive Vicki alone, because her sample bank is AAC rather than plain recorded sound. All twenty-three voices speak, Vicki included: the host decodes her through the AAC decoder Windows already has. On the rare edition of Windows that ships without one -- the N and KN editions, until the Media Feature Pack is installed -- she is left out of the voice list instead, because a voice that can be chosen and is then silent would leave you unable to hear your way back out of the dialog. Windows 7's decoder hands back one frame less than later versions do, which used to make Vicki's syllables run together; the host now pushes that frame out of it, so she sounds the same on every version of Windows.

This add-on contains no part of Apple's software, and the packaging script refuses to build one that does. You supply your own Tiger install; the engine and voices are read from wherever you extracted them. Put the extracted folder into "tigerspeech-data" inside your NVDA user configuration folder. It goes there rather than in the add-on folder because updating an add-on deletes and recreates its directory. If you would rather keep it on another drive, write the path into a file called tigerspeech-data.txt in the same place, or set the TIGER_TREE environment variable.

You can set the rate and the pitch. Pitch is measured in semitones from each voice's own natural pitch, so the middle of the slider is the voice as Apple recorded it and the ends are an octave either way.

Tiger's front end also understands embedded speech commands such as [[slnc 500]] for a pause, [[volm 0.5]] for volume, and even [[inpt TUNE]] for singing. Those are off by default, because a web page containing two square brackets could otherwise change how your screen reader sounds; turn them on in the synthesizer settings if you want them.

The voice files themselves never changed. Fred's 714 bytes are byte-identical from System 7 in 1993 to Leopard in 2007, and all 29 MB of Vicki is identical between the PowerPC and Intel builds of Tiger. Everything people remember as sounding different is the engine around them, which is why this exists at all."""
author = "Apple (engine) -- NVDA driver and host: tgeczy"
url = "https://github.com/tgeczy/panthera-speech"
version = 0.8.0
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.1
