name = leopardspeech
summary = "Leopard speech (Alex, and twenty-three more)"
description = """Mac OS X 10.5 Leopard's speech engine, running as native x86 code inside NVDA's own process. No emulator, no virtual machine.

The voice this exists for is Alex. He is concatenative: rather than modelling a voice, he is assembled from a recorded one, and Leopard's Alex is the full 669 MB of it -- the version from before Apple shrank him to fit a smaller disc. His sample bank is memory-mapped and paged in as he speaks, so the size costs address space rather than a wait; a short sentence touches about a tenth of it.

Twenty-four voices in all, across the three engines Leopard ships. Alex and Vicki are concatenative. Bruce, Victoria and Agnes come from MacinTalk Pro. The nineteen MacinTalk 3 voices include Fred and the singing novelty voices.

This add-on contains no part of Apple's software. You supply it from your own Mac OS X 10.5 install disc, and the extractor in the project repository pulls it out of an installer image for you.

Leopard's engine also needs Apple's own C++ runtime, libstdc++.6.0.4.dylib, which sits on the same disc under usr/lib. The extractor takes it. Assembled by hand, it has to be there too, or the engine will not load at all."""
author = "Apple (engine) -- NVDA driver: tgeczy"
url = "https://github.com/tgeczy/leopard-speech"
