name = pantheraspeech
summary = "Panthera speech (Mac OS X: Tiger, Leopard and Lion)"
description = """Speak with the voices Apple shipped in Mac OS X, running as native code on your own machine. No emulator and no virtual machine: a small host process maps Apple's Intel MacinTalk into memory and calls it directly.

Three synthesizers, listed separately in NVDA, because switching generation is switching synthesizer -- a different engine, a different voice list and a different sample bank of up to 700 MB. A generation you have no speech data for is simply not in the list; the Tools menu item says what was looked for and what was missing.

Tiger speech is Mac OS X 10.4, and twenty-three voices. Fred as he sounded in 2005, which is not the Fred any current system will give you. Tiger's MacinTalk is three engines in one bundle and the voices divide between them: MacinTalk 3 drives Fred, Kathy, Princess, Junior, Ralph and the novelty voices, MacinTalk Pro drives Bruce, Victoria and Agnes, and a third engine exists to drive Vicki alone because her sample bank is AAC rather than plain recorded sound. All twenty-three speak, Vicki included, decoded through the AAC decoder Windows already has. On the N and KN editions of Windows, which ship without one until the Media Feature Pack is installed, she is left out of the voice list instead: a voice that can be chosen and is then silent would leave you unable to hear your way back out of the dialog.

Leopard speech is Mac OS X 10.5, and twenty-four. The voice it exists for is Alex. He is concatenative -- rather than modelling a voice he is assembled from a recorded one -- and Leopard's Alex is the full 669 MB of him, the version from before Apple shrank him to fit a smaller disc. His sample bank is memory-mapped and paged in as he speaks, so the size costs address space rather than a wait; a short sentence touches about a tenth of it. Alex and Vicki are concatenative here, Bruce, Victoria and Agnes come from MacinTalk Pro, and the nineteen MacinTalk 3 voices include Fred and the singing novelty voices.

Lion speech is Mac OS X 10.7, and twenty-four again. It is the last version of MacinTalk Apple ever shipped -- the engine calls itself 4.0 where Leopard's calls itself 3.6 -- and 10.7 is where Apple's attention moved elsewhere. Its Alex is a quarter the size of Leopard's, at 422 MB against 669, and measures cleaner. Lion needs two libraries of Apple's rather than one, libstdc++.6.0.9.dylib and libc++abi.dylib, because 10.7 moved the C++ ABI into a library of its own; the extractor takes both, and without either one nothing loads. The multilingual "Compact" voices on that disc are a different synthesizer with a different lineage and are neither extracted nor listed.

All three offer rate and pitch. Pitch is measured in semitones from each voice's own natural pitch, so the middle of the slider is the voice as Apple recorded it and the ends are an octave either way. Leopard and Lion add volume, phrase breaks and a dictionary front end that Tiger's engine has no equivalent of.

Tiger's front end understands embedded speech commands such as [[slnc 500]] for a pause, [[volm 0.5]] for volume, and even [[inpt TUNE]] for singing. Those are off by default, because a web page containing two square brackets could otherwise change how your screen reader sounds; turn them on in the synthesizer settings if you want them.

This add-on contains no part of Apple's software, and the packaging script refuses to build one that does. You supply your own install discs; each engine is read from wherever you extracted it, under a "macintalk" folder in your NVDA user configuration folder. It goes there rather than in the add-on folder because updating an add-on deletes and recreates its directory. Leopard's engine also needs Apple's own C++ runtime, libstdc++.6.0.4.dylib, which sits on the same disc under usr/lib; the extractor takes it, and without it nothing loads at all.

The voice files themselves never changed. Fred's 714 bytes are byte-identical from System 7 in 1993 to Leopard in 2007, and all 29 MB of Vicki is identical between the PowerPC and Intel builds of Tiger. Everything people remember as sounding different is the engine around them, which is why this exists at all."""
author = "Apple (engine) -- NVDA drivers and host: tgeczy"
url = "https://github.com/tgeczy/panthera-speech"
version = 0.98.0
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.1
